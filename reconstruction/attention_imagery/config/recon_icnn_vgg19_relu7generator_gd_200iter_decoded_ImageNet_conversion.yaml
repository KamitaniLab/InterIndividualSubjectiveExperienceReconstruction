# Reconstruction configuration file

defaults:
  - encoder: vgg19
  - generator: relu7generator

decoded_features:
  name: ImageNetTest_deeprecon_VGG19
  path:
  subjects:
    - target
  rois:
    - VC
  decoders:
    path: ../../data/pre-trained/decoders/attention_imagery/deeprecon_fmriprep_rep5_500voxel_allunits_fastl2lir_alpha100/caffe/VGG_ILSVRC_19_layers

icnn:
  num_iteration: 200
  feature_scaling: feature_std_train_mean_center

output:
  path: ./data/reconstruction/icnn/${_run.name}_${encoder.name}_${generator.name}_scaling_${icnn.feature_scaling}_${icnn.num_iteration}iter/decoded/${decoded_features.name}
  prefix: recon_image-
  ext: tiff

evaluation:
  true_image:
    path: /home/nu/data/contents_shared/ImageNetTest/source
    ext: JPEG
